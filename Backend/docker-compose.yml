version: '3.8'

services:
  sut-sihirbazi-api:
    build: .
    container_name: sut_sihirbazi_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app

    # Geliştirilmiş, temizlenmiş entrypoint
    entrypoint: [ "sh", "-c", "/app/start.sh" ]
    environment:
      - TZ=Europe/Istanbul
      - PYTHONUNBUFFERED=1
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - CLOUD_LLM=${CLOUD_LLM}
      - LOCAL_LLM=${LOCAL_LLM}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    # === YENİ EKLENEN OTOMASYON BLOĞU ===
    develop:
      watch:
        # requirements.txt veya Dockerfile değişirse otomatik rebuild et
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./Dockerfile
        # Diğer python veya script kodları değişirse dosyayı senkronize et (uvicorn --reload halledecek)
        - action: sync
          path: .
          target: /app
